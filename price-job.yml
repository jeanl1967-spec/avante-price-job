# Weekly StockNetwork price check for the Avante hooks site.
# Every Monday at 04:00 South African time (02:00 UTC) — or any time from
# the Actions tab ("Run workflow") — it reads the lowest nightly price for
# every hub property from StockNetwork's booking pages and saves the list to
# https://avante-hooks.netlify.app, where "from R… per night" fills in.
name: Weekly price check
on:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch: {}
jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install the browser
        run: |
          npm install --no-save playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Check prices on StockNetwork and save them
        env:
          RATES_TOKEN: ${{ secrets.RATES_TOKEN }}
          PARALLEL: "4"
        run: node scripts/scrape-rates.mjs
