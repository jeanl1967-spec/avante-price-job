{"name": "Weekly price check",
 "on": {"schedule": [{"cron": "0 2 * * 1,3,5"}], "workflow_dispatch": {}},
 "jobs": {"prices": {"runs-on": "ubuntu-latest", "timeout-minutes": 340,
   "strategy": {"fail-fast": false, "matrix": {"shard": [0, 1, 2]}},
   "steps": [
   {"uses": "actions/checkout@v4"},
   {"uses": "actions/setup-node@v4", "with": {"node-version": 20}},
   {"name": "Install the browser", "run": "npm install --no-save playwright@1.56.0 && npx playwright install --with-deps chromium"},
   {"name": "Check prices on StockNetwork and save them", "env": {"RATES_TOKEN": "${{ secrets.RATES_TOKEN }}", "SHARD": "${{ matrix.shard }}", "SHARDS": "3", "PARALLEL": "8", "TIME_BUDGET_MIN": "320"}, "run": "node scrape-rates.mjs"}
 ]}}}
